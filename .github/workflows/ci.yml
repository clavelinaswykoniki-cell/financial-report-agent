name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llm]"
      - name: Run tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          financial-report-agent --help
          financial-report-dashboard --help
      - name: Secret placeholder scan
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          pattern = re.compile(r"(sk-[A-Za-z0-9_-]{20,}|(?:OPENAI|DEEPSEEK|FIN_AGENT)_API_KEY=[\"']?sk-[A-Za-z0-9_-]{20,})")
          skipped_dirs = {".git", ".venv", ".cache", "reports", "__pycache__"}
          matches = []
          for path in Path(".").rglob("*"):
              if path.is_dir() or any(part in skipped_dirs for part in path.parts):
                  continue
              if path.suffix in {".png", ".pyc"}:
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              for line_no, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      matches.append(f"{path}:{line_no}")
          if matches:
              print("Potential secret matches:")
              print("\n".join(matches))
              sys.exit(1)
          PY
