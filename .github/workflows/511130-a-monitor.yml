name: 511130 a-value monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: precheck, once, or notify-test
        required: true
        default: once
        type: choice
        options:
          - precheck
          - once
          - notify-test
  schedule:
    # Asia/Shanghai = UTC+8.
    # 2026-06-14 20:00 CST: PCF evening check.
    - cron: "0 12 14 6 *"
    # 2026-06-15 08:00 CST: PCF morning check.
    - cron: "0 0 15 6 *"
    # 2026-06-15 trading monitor, roughly 09:00-11:55 and 13:00-15:55 CST.
    - cron: "*/5 1-3 15 6 *"
    - cron: "*/5 5-7 15 6 *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      A_MONITOR_WEBHOOK_URL: ${{ secrets.A_MONITOR_WEBHOOK_URL }}
      A_MONITOR_WEBHOOK_KIND: ${{ secrets.A_MONITOR_WEBHOOK_KIND }}
      A_MONITOR_FEISHU_SECRET: ${{ secrets.A_MONITOR_FEISHU_SECRET }}
      A_MONITOR_THRESHOLDS: ${{ vars.A_MONITOR_THRESHOLDS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install monitor dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/511130_live_monitor/requirements.txt

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: scripts/511130_live_monitor/state.json
          key: 511130-state-20260615-${{ github.run_id }}
          restore-keys: |
            511130-state-20260615-

      - name: Resolve mode
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=Asia/Shanghai date +%H)"
          if [ "$hour" = "20" ] || [ "$hour" = "08" ]; then
            echo "mode=precheck" >> "$GITHUB_OUTPUT"
          else
            echo "mode=once" >> "$GITHUB_OUTPUT"
          fi

      - name: Run 511130 monitor
        run: |
          python scripts/511130_live_monitor/monitor_511130.py --mode "${{ steps.resolve.outputs.mode }}" --notify

      - name: Save monitor state
        if: always() && hashFiles('scripts/511130_live_monitor/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: scripts/511130_live_monitor/state.json
          key: 511130-state-20260615-${{ github.run_id }}
